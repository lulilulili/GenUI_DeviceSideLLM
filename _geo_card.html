<body style="background:#141b2c;padding:40px"><style>
.gv2-card{position:relative;width:190px;height:190px;border-radius:38px;background:linear-gradient(150deg,#4f8bf7,#2f5fd9);
  color:#ffffff;padding:16px;box-sizing:border-box;overflow:hidden;box-shadow:0 10px 28px rgba(20,32,60,.28);
  font-family:'HarmonyOS Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
.gv2-card .grid{display:grid;width:100%;height:100%;grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(12,1fr);gap:8px}
.gv2-card .titlebar{position:absolute;top:16px;left:16px;right:16px;display:flex;
  justify-content:space-between;align-items:center;pointer-events:none}
.gv2-card .titlebar .t{font-size:14px;font-weight:700}
.gv2-card .chip{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.gv2-card .chip.ph{opacity:.85}
.gv2-card section{min-width:0;min-height:0;display:flex;align-items:stretch;overflow:hidden}
.gv2-card section>*{width:100%}
.gv2-card section.compact .hero{font-size:20px;letter-spacing:0}
.gv2-card section.compact .hero i{font-size:11px}
.gv2-card section.compact .lbl{font-size:10.5px}
.gv2-card section.compact .status b{font-size:13px;-webkit-line-clamp:1}
.gv2-card section.compact .ring{width:38px;height:38px}
.gv2-card section.compact .ring b{font-size:11px}
.gv2-card .lbl{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.78);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv2-card .metric{display:flex;flex-direction:column;justify-content:center;gap:2px}
.gv2-card .hero{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.gv2-card .hero i{font-style:normal;font-size:14px;font-weight:600;margin-left:2px;color:rgba(255,255,255,.78)}
.gv2-card .status{display:flex;flex-direction:column;justify-content:center;gap:2px}
.gv2-card .status b{font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gv2-card .text p{margin:2px 0 0;font-size:13px;line-height:1.45;color:#ffffff;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gv2-card .pill{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;
  align-self:center;border-radius:18px;background:rgba(255,255,255,.24);color:#ffffff;
  font-size:13px;font-weight:600;padding:0 14px;white-space:nowrap}
.gv2-card .pilligo{font-size:14px}
.gv2-card .switchrow,.gv2-card .sliderrow{display:flex;flex-direction:column;justify-content:center;gap:6px}
.gv2-card .switch{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.22);position:relative;transition:.2s}
.gv2-card .switch.on{background:#ffd76b}
.gv2-card .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.gv2-card .switch.on .knob{left:20px}
.gv2-card .slider{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.22);position:relative}
.gv2-card .slider::after{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*1%);
  border-radius:3px;background:#ffd76b}
.gv2-card .progress{display:flex;flex-direction:column;align-items:flex-start;gap:4px;justify-content:center}
.gv2-card .ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#ffd76b calc(var(--p)*1%),rgba(255,255,255,.22) 0);position:relative}
.gv2-card .ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:#2f5fd9}
.gv2-card .ring b{position:relative;font-size:15px;font-weight:700}
.gv2-card .ring b i{font-style:normal;font-size:10px;font-weight:500;color:rgba(255,255,255,.78)}
.gv2-card .listbox{display:flex;flex-direction:column;justify-content:center;gap:4px;height:100%}
.gv2-card .chiprow{display:flex;gap:6px;align-items:center;height:100%;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gv2-card .chiprow::-webkit-scrollbar{display:none}
.gv2-card .chipbtn{flex-shrink:0;height:28px;line-height:28px;padding:0 13px;border-radius:14px;
  background:rgba(255,255,255,.24);color:#ffffff;font-size:12px;font-weight:500;white-space:nowrap}
.gv2-card .media{width:100%;height:100%;border-radius:12px;background:rgba(255,255,255,.22);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;opacity:.9}
.gv2-card .media span{font-size:10px;color:rgba(255,255,255,.78)}
.gv2-card .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.gv2-card .list li{font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gv2-card .dot{width:5px;height:5px;border-radius:50%;background:#ffd76b;flex-shrink:0}
.gv2-card [data-unbound]{opacity:.55}
.gv2-card.with-title .grid{height:calc(100% - 38px);margin-top:38px}</style><div class="gv2-card with-title" data-template="free_2x2" data-size="2x2"><div class="titlebar"><span class="t">今天北京天气预报</span><span class="chip">●</span></div><div class="grid"><section style="grid-column:1/span 12;grid-row:1/span 4"><div class="status"><span class="lbl">天气状况</span><b>状态正常</b></div></section><section class="compact" style="grid-column:1/span 6;grid-row:5/span 3"><div class="metric"><span class="lbl">降水概率</span><span class="hero">20.0<i>%</i></span></div></section><section style="grid-column:7/span 6;grid-row:5/span 3"><div class="text"><span class="lbl">城市</span><p>北京</p></div></section><section style="grid-column:1/span 12;grid-row:10/span 3"><div class="pill"><span class="pilligo">●</span><span>日预报</span></div></section></div></div></body>
